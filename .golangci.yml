# GASH golangci-lint configuration (v2 format; CI pins the binary version).
# Phase 2: vet + clean target. P0.4: config migrated from v1 (which v2
# binaries refuse to load) so the lint gate actually executes.
version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - misspell
    - unconvert
    - nakedret
    - ineffassign
  settings:
    misspell:
      ignore-rules:
        - mamal
  exclusions:
    # Default builds link always-error headless stubs; deep builds link the real
    # verifier. SA4023 cannot see across build tags.
    rules:
      - path: internal/bench/verify\.go
        linters:
          - staticcheck
        text: "SA4023"
      - path: internal/engine/browser_verify\.go
        linters:
          - staticcheck
        text: "SA4023"
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-same-issues: 0
