# GASH golangci-lint configuration (v2 format; CI pins the binary version).
# Phase 2: vet + clean target. P0.4: config migrated from v1 (which v2
# binaries refuse to load) so the lint gate actually executes.
version: "2"
run:
  timeout: 5m
linters:
  enable:
    - govet
    - staticcheck
    - unused
    - misspell
    - unconvert
    - nakedret
    - wrapcheck
    - contextcheck
  settings:
    wrapcheck:
      ignoreSigs:
        - .Errorf
        - errors.New
        - errors.Unwrap
    contextcheck:
      allowed-receiver-names:
        - Client
        - Engine
        - Registry
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-same-issues: 0
