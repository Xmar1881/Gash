id: grafana-api-exposure
name: Grafana API Exposure
description: Detects public Grafana health and organization APIs.
author: GASH contributors
severity: high
tags: [grafana, monitoring, admin, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 138
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/api/health", "/api/org", "/api/orgs"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_grafana_api]
