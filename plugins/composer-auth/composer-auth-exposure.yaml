id: composer-auth-exposure
name: Composer Auth Exposure
description: Detects exposed Composer authentication files containing registry tokens.
author: GASH contributors
severity: critical
tags: [composer, php, secrets, supply-chain]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 123
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/auth.json", "/.composer/auth.json", "/composer/auth.json"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_composer_auth]
