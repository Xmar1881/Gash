# File: plugins/hpp/hpp-parameter-pollution.yaml
# What: Tier 1 HTTP Parameter Pollution plugin backed by DifferentialOracle.
# Why: Divergent stable responses for polluted versus single parameter values
#   prove server-side parsing confusion (3/3 masked stability + divergence).
# Note: Tier 1 models pollution as true/false value divergence; native
#   duplicated-key emission (id=1&id=2) is future Tier 2 work (see metrics).

id: hpp-parameter-pollution
name: HTTP Parameter Pollution (Differential)
description: Detects HTTP parameter pollution via differential response analysis on polluted versus single parameter values.
author: GASH contributors
severity: medium
tags: [hpp, parameter-pollution, injection, differential]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 100
phase: probe
order: 63
api_version: "1.0"
tests: tests/fixtures/hpp-parameter-pollution/
request:
  method: GET
  param_names: [id, page, category, sort, filter, q, user]
  payload: "1"
oracle:
  name: differential
  params:
    repeats: 3
    false_payload: "2"
