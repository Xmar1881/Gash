# File: plugins/prototype-pollution/prototype-pollution-differential.yaml
# What: Tier 1 prototype pollution screen via DifferentialOracle (GASH-040, CWE-1321).
# Why: JSON/JS object endpoints reflecting a harmless canary after __proto__ or
#   constructor.prototype injection indicate prototype pollution (firm ceiling).
#   No privilege-escalating values are ever sent (admin:true YOK).

id: prototype-pollution-differential
name: Prototype Pollution (Differential)
description: Detects prototype pollution via differential reflection of a harmless canary after __proto__ and constructor.prototype injection.
author: GASH contributors
severity: high
tags: [prototype-pollution, injection, differential, javascript]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 20
phase: probe
order: 76
api_version: "1.0"
tests: tests/fixtures/prototype-pollution-differential/
request:
  method: GET
  param_names: [input, data, json, obj]
  payload: '{"__proto__":{"gashCanary":"x"}}'
  payloads:
    - '{"constructor":{"prototype":{"gashCanary":"x"}}}'
oracle:
  name: differential
  params:
    confidence_ceiling: firm
    false_payload: '{"gashCanary":"control"}'
    repeats: 3
