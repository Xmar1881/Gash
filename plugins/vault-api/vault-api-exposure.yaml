id: vault-api-exposure
name: Vault API Exposure
description: Detects unauthenticated HashiCorp Vault API responses on common health and secret paths.
author: GASH contributors
severity: critical
tags: [vault, cloud, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 128
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/v1/sys/health", "/v1/sys/seal-status", "/v1/secret/data/app"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_vault_api]
