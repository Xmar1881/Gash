id: haproxy-stats-exposure
name: HAProxy Stats Exposure
description: Detects exposed HAProxy statistics and backend state.
author: GASH contributors
severity: high
tags: [haproxy, proxy, information-disclosure, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 178
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/haproxy_stats", "/haproxy?stats", "/stats"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_haproxy_stats]
