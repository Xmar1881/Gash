id: laravel-debug-exposure
name: Laravel Debug Exposure
description: Detects Laravel Ignition, Whoops, or Debugbar pages exposed to unauthenticated users.
author: GASH contributors
severity: high
tags: [laravel, debug, framework, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 143
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/", "/_debugbar/open", "/ignition"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_laravel_debug]
