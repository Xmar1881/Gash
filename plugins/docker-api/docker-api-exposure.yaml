id: docker-api-exposure
name: Docker API Exposure
description: Detects unauthenticated Docker Engine API responses on common read-only endpoints.
author: GASH contributors
severity: critical
tags: [docker, container, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 131
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/version", "/containers/json", "/images/json"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_docker_api]
