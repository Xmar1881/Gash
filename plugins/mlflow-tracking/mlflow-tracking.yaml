id: mlflow-tracking
name: MLflow Tracking Exposure
description: Detects an exposed MLflow Tracking Exposure management or metadata endpoint using a product-specific response marker.
author: GASH contributors
severity: high
tags: [ml, tracking, error, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 3
phase: discovery
order: 304
api_version: "1.0"
tests: tests/fixtures/rare-critical-exposure/
request:
  method: GET
  paths: ["/api/2.0/mlflow/experiments/list"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_rare_mlflow_tracking]
