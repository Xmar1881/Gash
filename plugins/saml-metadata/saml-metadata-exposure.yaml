id: saml-metadata-exposure
name: SAML Metadata Exposure
description: Detects publicly served SAML identity-provider metadata and response material.
author: GASH contributors
severity: high
tags: [saml, sso, identity, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 146
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/saml/metadata", "/saml/metadata.xml", "/metadata"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_saml_metadata]
