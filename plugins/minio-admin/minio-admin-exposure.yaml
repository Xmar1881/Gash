id: minio-admin-exposure
name: MinIO Admin Exposure
description: Detects public MinIO health, admin, or bucket-listing responses.
author: GASH contributors
severity: critical
tags: [minio, object-storage, cloud, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 150
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/minio/health/live", "/minio/admin/v3/info", "/"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_minio_admin]
