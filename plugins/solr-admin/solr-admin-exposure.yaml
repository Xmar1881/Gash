id: solr-admin-exposure
name: Solr Admin Exposure
description: Detects public Apache Solr administration and core status endpoints.
author: GASH contributors
severity: high
tags: [solr, search, admin, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 135
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/solr/", "/solr/admin/cores", "/solr/admin/info/system"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_solr_admin]
