id: istio-debug-exposure
name: Istio Debug Exposure
description: Detects exposed Istio proxy debug and discovery endpoints.
author: GASH contributors
severity: critical
tags: [istio, kubernetes, service-mesh, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 180
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/debug/adsz", "/debug/syncz", "/config_dump"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_istio_debug]
