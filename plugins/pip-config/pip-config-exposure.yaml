id: pip-config-exposure
name: Pip Config Exposure
description: Detects authenticated Python package indexes in exposed pip config.
author: GASH contributors
severity: critical
tags: [python, pip, supply-chain, secrets]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 163
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.pip/pip.conf", "/pip.conf", "/.config/pip/pip.conf"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_pip_config]
