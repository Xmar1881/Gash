id: metabase-api-exposure
name: Metabase API Exposure
description: Detects exposed Metabase health and session configuration APIs.
author: GASH contributors
severity: critical
tags: [metabase, analytics, admin, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 197
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
