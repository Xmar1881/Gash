id: npmrc-token-exposure
name: NPM Token Exposure
description: Detects exposed npm configuration files containing registry credentials.
author: GASH contributors
severity: critical
tags: [npm, secrets, supply-chain, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 122
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.npmrc", "/npmrc", "/.config/npm/npmrc"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_npmrc_token]
