#
# File: plugins/jsonp-callback-injection/jsonp-callback-injection.yaml
# What: Tier 1 JSONP callback injection screen via ReflectionOracle with a
#   deterministic canary token (GASH-062, CWE-79).
# Why: A JSONP endpoint that wraps its response in an attacker-supplied
#   callback name lets a third-party page read the JSON payload (and turns
#   into XSS when the name is reflected into executable script). The canary
#   token must appear in HTML text or executable script context; pure JSON
#   documents and string/comment reflections are rejected by the oracle.

id: jsonp-callback-injection
name: JSONP Callback Injection
description: Detects JSONP endpoints reflecting an attacker-controlled callback name into HTML or script response contexts.
author: GASH contributors
severity: medium
tags: [jsonp, injection, reflection, misconfig]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 20
phase: probe
order: 93
api_version: "1.0"
tests: tests/fixtures/jsonp-callback-injection/
request:
  method: GET
  param_names: [callback, cb, jsonp, jsoncallback]
  payload: gash_jsonp_9c1f7e2a
oracle:
  name: reflection
  params:
    require_executable_context: false
    contexts: [html, script]
