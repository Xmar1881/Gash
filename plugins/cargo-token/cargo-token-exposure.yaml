id: cargo-token-exposure
name: Cargo Token Exposure
description: Detects exposed Rust crates.io registry credentials.
author: GASH contributors
severity: critical
tags: [rust, cargo, supply-chain, secrets]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 166
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.cargo/credentials", "/.cargo/credentials.toml", "/cargo/credentials"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_cargo_token]
