# File: plugins/nosql/nosql-injection-timing.yaml
# What: Tier 1 blind NoSQL injection plugin backed by TimingOracle.
# Why: Time-based blind NoSQL injection via $where JavaScript sleep or
#   heavy query operators; firm ceiling without OOB.
#   Harmless sleep canary only; no data exfiltration or destructive payload.

id: nosql-injection-timing
name: NoSQL Injection Time-Based (Blind)
description: Detects blind NoSQL injection via statistical delay analysis using MongoDB $where sleep canary (firm maximum, never confirmed without OOB).
author: GASH contributors
severity: high
tags: [nosql, injection, blind, timing]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 80
phase: probe
order: 65
api_version: "1.0"
tests: tests/fixtures/nosql-injection-timing/
request:
  method: GET
  param_names: [search, filter, q, query, id, username]
  payload: '{"$where": "sleep(5000)"}'
  payloads:
    - '{"$where": "var d=new Date(); do {var d2=new Date();} while(d2-d<5000);"}'
    - '{"$where": "sleep(5000)"}'
oracle:
  name: timing
  params:
    min_delay_ms: 5000
    repeats: 3
    strategy: "mann-whitney-u"