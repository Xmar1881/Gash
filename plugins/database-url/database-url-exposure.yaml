id: database-url-exposure
name: Database URL Exposure
description: Detects database connection URLs and passwords in exposed env files.
author: GASH contributors
severity: critical
tags: [database, credentials, configuration, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 169
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.env.production", "/config/database.env", "/database.env"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_database_url]
