# File: plugins/version-disclosure/server-version-disclosure.yaml
# What: Tier 1 passive version disclosure plugin backed by VersionOracle (banner mode).
# Why: Detects server version leakage via passive banner/header analysis.

id: server-version-disclosure
name: Server Version Disclosure
description: Detects server version disclosure via passive banner/header analysis.
author: GASH contributors
severity: low
tags: [version, information-disclosure, reconnaissance, banner]
safe: true
deep: false
active: false
requires_auth: false
phase: probe
order: 15
api_version: "1.0"
tests: tests/fixtures/server-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: "banner"
    banner_regex: "(?i)(apache|nginx|php|express|server:|x-powered-by).*[\\d]+\\.[\\d]+"