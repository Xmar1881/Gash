id: template-injection-reflection
name: Server-Side Template Injection (Reflection)
description: Detects server-side template injection via template expression reflection in responses.
author: GASH contributors
severity: critical
tags: [ssti, template-injection, injection, rce, reflection]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 100
phase: probe
order: 45
api_version: "1.0"
tests: tests/fixtures/template-injection-reflection/
request:
  method: GET
  param_names: ["template", "name", "message", "content", "body", "input", "query", "search"]
  payload: "{{7*7}}"
oracle:
  name: reflection