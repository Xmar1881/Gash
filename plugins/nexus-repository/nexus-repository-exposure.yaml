id: nexus-repository-exposure
name: Nexus Repository Exposure
description: Detects exposed Nexus Repository status and repository APIs.
author: GASH contributors
severity: critical
tags: [nexus, repository, supply-chain, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 191
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/service/rest/v1/status", "/repository/", "/nexus/service/rest/v1/status"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_nexus]
