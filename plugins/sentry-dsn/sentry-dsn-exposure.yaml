id: sentry-dsn-exposure
name: Sentry DSN Exposure
description: Detects exposed Sentry DSNs in public runtime configuration.
author: GASH contributors
severity: high
tags: [sentry, telemetry, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 173
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/config/sentry.json", "/sentry.env", "/sentry-dsn.txt"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_sentry_dsn]
