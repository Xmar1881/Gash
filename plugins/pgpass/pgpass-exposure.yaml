id: pgpass-exposure
name: PGPass Exposure
description: Detects PostgreSQL password files exposed through application roots.
author: GASH contributors
severity: critical
tags: [postgresql, database, credentials, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 168
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.pgpass", "/pgpass", "/home/app/.pgpass"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_pgpass]
