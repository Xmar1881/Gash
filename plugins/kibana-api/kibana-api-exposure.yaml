id: kibana-api-exposure
name: Kibana API Exposure
description: Detects public Kibana status and application endpoints.
author: GASH contributors
severity: high
tags: [kibana, elastic, admin, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 137
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/api/status", "/app/kibana", "/"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_kibana_api]
