id: concourse-version-disclosure
name: Concourse Fingerprint Disclosure
description: Detects the Concourse worker_version field on the public info API; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, concourse]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: discovery
order: 281
api_version: "1.0"
tests: tests/fixtures/concourse-version-disclosure/
request:
  method: GET
  paths:
    - "/api/v1/info"
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?is)\\\"worker_version\\\"\\s*:"
