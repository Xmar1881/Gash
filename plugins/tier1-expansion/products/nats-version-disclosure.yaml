id: nats-version-disclosure
name: NATS Fingerprint Disclosure
description: Detects the NATS server_name field on the monitoring varz endpoint; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, nats]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: discovery
order: 290
api_version: "1.0"
tests: tests/fixtures/nats-version-disclosure/
request:
  method: GET
  paths:
    - "/varz"
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?is)\\\"server_name\\\"\\s*:"
