id: thanos-version-disclosure
name: Thanos Fingerprint Disclosure
description: Detects the Thanos buildUser field on the public buildinfo API; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, thanos, prometheus]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: discovery
order: 293
api_version: "1.0"
tests: tests/fixtures/thanos-version-disclosure/
request:
  method: GET
  paths:
    - "/api/v1/status/buildinfo"
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?is)\\\"buildUser\\\"\\s*:"
