id: alertmanager-version-disclosure
name: Alertmanager Fingerprint Disclosure
description: Detects the Alertmanager versionInfo field on the public status API; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, alertmanager, prometheus]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: discovery
order: 287
api_version: "1.0"
tests: tests/fixtures/alertmanager-version-disclosure/
request:
  method: GET
  paths:
    - "/api/v2/status"
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?is)\\\"versionInfo\\\"\\s*:"
