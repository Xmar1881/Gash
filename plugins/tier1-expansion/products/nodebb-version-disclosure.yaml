id: nodebb-version-disclosure
name: NodeBB Fingerprint Disclosure
description: Detects NodeBB client asset markers; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, nodebb]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 257
api_version: "1.0"
tests: tests/fixtures/nodebb-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(nodebb\\.settings|data-nodebb|/assets/client-[a-z0-9]{8,}\\.js)"
