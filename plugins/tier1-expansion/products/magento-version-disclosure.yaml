id: magento-version-disclosure
name: Magento Fingerprint Disclosure
description: Detects the Magento version endpoint or static version asset paths; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, magento]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: discovery
order: 247
api_version: "1.0"
tests: tests/fixtures/magento-version-disclosure/
request:
  method: GET
  paths:
    - "/magento_version"
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(Magento/\\d|/static/version\\d+/)"
