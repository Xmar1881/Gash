id: mediawiki-version-disclosure
name: MediaWiki Fingerprint Disclosure
description: Detects MediaWiki generator metadata or load.php module paths; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, mediawiki]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 258
api_version: "1.0"
tests: tests/fixtures/mediawiki-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(<meta name=\\\"generator\\\" content=\\\"MediaWiki|/load\\.php\\?modules=)"
