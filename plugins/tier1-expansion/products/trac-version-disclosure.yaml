id: trac-version-disclosure
name: Trac Fingerprint Disclosure
description: Detects Trac generator metadata or /trac/ paths; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, trac]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 265
api_version: "1.0"
tests: tests/fixtures/trac-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(<meta name=\\\"generator\\\" content=\\\"Trac|/trac/)"
