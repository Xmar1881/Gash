id: joomla-version-disclosure
name: Joomla Fingerprint Disclosure
description: Detects Joomla generator metadata or core asset paths; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, joomla]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 242
api_version: "1.0"
tests: tests/fixtures/joomla-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(<meta name=\\\"generator\\\" content=\\\"Joomla!|/media/system/js/core\\.js|option=com_content)"
