id: phpbb-version-disclosure
name: phpBB Fingerprint Disclosure
description: Detects phpBB footer or core stylesheet markers; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, phpbb]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 251
api_version: "1.0"
tests: tests/fixtures/phpbb-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(phpBB|styles/prosilver|/assets/javascript/core\\.js)"
