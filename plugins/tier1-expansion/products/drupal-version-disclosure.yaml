id: drupal-version-disclosure
name: Drupal Fingerprint Disclosure
description: Detects Drupal script settings or core asset paths in public responses; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, drupal]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 241
api_version: "1.0"
tests: tests/fixtures/drupal-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(Drupal\\.settings|core/misc/drupal\\.js|sites/(all|default)/(files|modules)/)"
