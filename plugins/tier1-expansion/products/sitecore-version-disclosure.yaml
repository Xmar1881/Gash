id: sitecore-version-disclosure
name: Sitecore Fingerprint Disclosure
description: Detects Sitecore paths or analytics cookie markers; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, sitecore]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: discovery
order: 246
api_version: "1.0"
tests: tests/fixtures/sitecore-version-disclosure/
request:
  method: GET
  paths:
    - "/sitecore/"
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(sitecore|SC_ANALYTICS_GLOBAL_COOKIE)"
