id: opensearch-version-disclosure
name: OpenSearch Fingerprint Disclosure
description: Detects the OpenSearch distribution field on the public root API; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, opensearch]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: discovery
order: 288
api_version: "1.0"
tests: tests/fixtures/opensearch-version-disclosure/
request:
  method: GET
  paths:
    - "/"
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?is)\\\"distribution\\\"\\s*:\\s*\\\"opensearch\\\""
