id: wordpress-version-disclosure
name: WordPress Fingerprint Disclosure
description: Detects WordPress asset paths (wp-content themes/plugins or wp-includes) in public responses; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, wordpress]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 240
api_version: "1.0"
tests: tests/fixtures/wordpress-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(wp-content/(themes|plugins|uploads)/|wp-includes/(js|css)/)"
