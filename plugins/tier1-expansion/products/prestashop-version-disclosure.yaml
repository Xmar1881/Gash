id: prestashop-version-disclosure
name: PrestaShop Fingerprint Disclosure
description: Detects PrestaShop generator metadata in public responses; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, prestashop]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 248
api_version: "1.0"
tests: tests/fixtures/prestashop-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(<meta name=\\\"generator\\\" content=\\\"PrestaShop|prestashop)"
