id: cloudreve-version-disclosure
name: Cloudreve Fingerprint Disclosure
description: Detects Cloudreve markers or site-config API paths; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, cloudreve]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 300
api_version: "1.0"
tests: tests/fixtures/cloudreve-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(Cloudreve|/api/v3/site/config)"
