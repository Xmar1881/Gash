id: opentsdb-version-disclosure
name: OpenTSDB Fingerprint Disclosure
description: Detects the OpenTSDB short_revision field on the public version API; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, opentsdb]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: discovery
order: 291
api_version: "1.0"
tests: tests/fixtures/opentsdb-version-disclosure/
request:
  method: GET
  paths:
    - "/api/version"
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?is)\\\"short_revision\\\"\\s*:"
