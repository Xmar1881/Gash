id: cgit-version-disclosure
name: cgit Fingerprint Disclosure
description: Detects cgit version footers or cgit stylesheet markers; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, cgit]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 280
api_version: "1.0"
tests: tests/fixtures/cgit-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(cgit v\\d|generator\\\" content=\\\"cgit|/cgit\\.css)"
