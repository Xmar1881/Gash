id: arangodb-version-disclosure
name: ArangoDB Fingerprint Disclosure
description: Detects ArangoDB markers or system database paths; banner-only fingerprint, tentative confidence.
author: GASH contributors
severity: low
tags: [version, fingerprint, disclosure, arangodb]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 303
api_version: "1.0"
tests: tests/fixtures/arangodb-version-disclosure/
request:
  method: GET
oracle:
  name: version
  params:
    mode: banner
    banner_regex: "(?i)(ArangoDB|_db/_system)"
