# File: plugins/tier1-expansion/headers/permissions-policy-payment-missing.yaml
# What: Permissions-Policy Payment Request restriction check.
# Why: The Payment Request API should be explicitly disabled on sites that do
#   not need it; the presence check owns the missing-header finding.

id: permissions-policy-payment-missing
name: Permissions-Policy Payment Missing
description: Detects an existing Permissions-Policy that does not restrict the Payment Request API.
author: GASH contributors
severity: low
tags: [headers, permissions-policy, payments, hardening, header]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 202
api_version: "1.0"
tests: tests/fixtures/permissions-policy-payment-missing/
request:
  method: GET
oracle:
  name: header
  params:
    mode: policy
    header_name: Permissions-Policy
    policy: required
    required_tokens: [payment]
    skip_if_header_missing: true
