id: referrer-policy-no-referrer-when-downgrade
name: Referrer-Policy no-referrer-when-downgrade
description: Detects the legacy no-referrer-when-downgrade Referrer-Policy, which sends full URLs on same-scheme requests.
author: GASH contributors
severity: info
tags: [headers, referrer-policy, privacy, misconfig, header]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 1
phase: probe
order: 209
api_version: "1.0"
tests: tests/fixtures/referrer-policy-no-referrer-when-downgrade/
request:
  method: GET
oracle:
  name: header
  params:
    mode: policy
    header_name: Referrer-Policy
    policy: forbidden_tokens
    forbidden_tokens: [no-referrer-when-downgrade]
