# Module: github.com/Xmar1881/Gash
#
# File: plugins/management-endpoint-exposure/management-endpoint-exposure.yaml
# What: Tier 1 management endpoint exposure screen via ErrorSignatureOracle
#   "content" mode with the management_endpoint signature set, fixed path
#   list, and soft-404 control absence (GASH-058, CWE-200).
# Why: Spring Actuator (env/heapdump/mappings/httptrace/beans), Apache
#   server-status, and the H2 console disclose configuration and runtime
#   state anonymously. A bare 200 is never enough: an actuator
#   configuration/heapdump body marker must be present and absent from the
#   soft-404 control of the same path (disabled-actuator JSON 404s stay
#   clean because they carry no marker).

id: management-endpoint-exposure
name: Management Endpoint Exposure
description: Detects exposed Spring Actuator, server-status, and H2 console endpoints by matching management body markers on fixed paths with soft-404 control absence.
author: GASH contributors
severity: medium
tags: [management-endpoint, exposure, misconfig, error]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 32
phase: probe
order: 89
api_version: "1.0"
tests: tests/fixtures/management-endpoint-exposure/
request:
  method: GET
  paths: ["/actuator/env", "/actuator/heapdump", "/actuator/mappings", "/actuator/httptrace", "/actuator/beans", "/server-status", "/h2-console"]
oracle:
  name: error
  params:
    mode: content
    signature_set: [management_endpoint]
