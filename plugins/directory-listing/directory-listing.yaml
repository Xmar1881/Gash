# Module: github.com/Xmar1881/Gash
#
# File: plugins/directory-listing/directory-listing.yaml
# What: Tier 1 directory listing exposure screen via ErrorSignatureOracle
#   "content" mode with the directory_listing signature set, common path
#   list, and soft-404 control absence (GASH-059, CWE-548).
# Why: Enabled indexing (Apache "Index of /", Python http.server "Directory
#   listing for /") discloses file names and structure. The title marker is
#   required and must be absent from the soft-404 control of the same path;
#   custom pages that merely mention "index of" in their text stay clean.

id: directory-listing
name: Directory Listing Exposure
description: Detects enabled directory indexing pages via server listing title markers on common directories with soft-404 control absence.
author: GASH contributors
severity: low
tags: [directory-listing, exposure, misconfig, error]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 16
phase: probe
order: 90
api_version: "1.0"
tests: tests/fixtures/directory-listing/
request:
  method: GET
  paths: ["/uploads/", "/backup/", "/files/", "/images/"]
oracle:
  name: error
  params:
    mode: content
    signature_set: [directory_listing]
