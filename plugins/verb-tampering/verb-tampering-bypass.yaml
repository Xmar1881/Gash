# File: plugins/verb-tampering/verb-tampering-bypass.yaml
# What: Tier 1 method/header authorization bypass screen via VerbTamperOracle (GASH-036, CWE-650).
# Why: Baseline GET 401/403 while HEAD, OPTIONS, X-HTTP-Method-Override,
#   X-Original-URL or X-Rewrite-URL variant returns 2xx with meaningful content
#   is verb-tampering evidence, firm ceiling. Only idempotent read variants are
#   sent (no PUT/DELETE); per path at most 6 requests.

id: verb-tampering-bypass
name: HTTP Verb Tampering Auth Bypass
description: Detects authorization bypass via method or override-header variants against protected paths where baseline GET returns 401 or 403.
author: GASH contributors
severity: high
tags: [verb-tampering, access-control, authorization, verb-tamper]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 20
phase: probe
order: 74
api_version: "1.0"
tests: tests/fixtures/verb-tampering-bypass/
request:
  method: GET
  paths: ["/admin", "/api/admin"]
oracle:
  name: verb-tamper
