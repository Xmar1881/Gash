id: aws-credentials-exposure
name: AWS Credentials Exposure
description: Detects exposed AWS credential profiles on fixed credential paths.
author: GASH contributors
severity: critical
tags: [cloud, aws, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 121
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.aws/credentials", "/aws/credentials", "/credentials"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_aws_credentials]
