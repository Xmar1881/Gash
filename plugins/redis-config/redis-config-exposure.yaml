id: redis-config-exposure
name: Redis Config Exposure
description: Detects exposed Redis authentication settings in config endpoints.
author: GASH contributors
severity: critical
tags: [redis, database, credentials, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 171
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/redis.conf", "/config/redis.conf", "/redis/config"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_redis_config]
