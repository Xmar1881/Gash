id: influxdb-api
name: InfluxDB API Exposure
description: Detects an exposed InfluxDB API Exposure management or metadata endpoint using a product-specific response marker.
author: GASH contributors
severity: high
tags: [database, admin, error, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 3
phase: discovery
order: 327
api_version: "1.0"
tests: tests/fixtures/rare-critical-exposure/
request:
  method: GET
  paths: ["/api/v2/buckets"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_rare_influxdb_api]
