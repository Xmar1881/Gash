# Module: github.com/Xmar1881/Gash
#
# File: plugins/sensitive-file-exposure/sensitive-file-exposure.yaml
# What: Tier 1 extended sensitive file exposure via ErrorSignatureOracle backup_file mode.
# Why: Expanded coverage beyond the 12-path backup-file list:
#   - Git: .git/config, .git/HEAD, .git/index, .git/logs/HEAD
#   - SVN: .svn/entries, .svn/wc.db
#   - Mercurial: .hg/store, .hg/requires
#   - Environment: .env, .env.local, .env.production, .env.development
#   - Config: config.json, config.yaml, config.yml, config.php, config.ini
#   - Docker: docker-compose.yml, docker-compose.yaml, Dockerfile, .dockerignore
#   - Kubernetes: kubeconfig, .kube/config
#   - SSH: id_rsa, id_rsa.pub, authorized_keys, known_hosts
#   - AWS: .aws/credentials, .aws/config
#   - Azure: .azure/config
#   - GCP: .config/gcloud/credentials
#   - IDE: .vscode/settings.json, .idea/workspace.xml
#   - Logs: error.log, debug.log, access.log, application.log
#   - Database: *.sqlite, *.db, *.sqlite3
#   - Archives: backup.zip, backup.tar.gz, dump.sql, backup.sql
#   GET only, no directory brute force: fixed bounded path list.
#   Overlap with GASH-028 content discovery is documented.

id: sensitive-file-exposure
name: Sensitive File Exposure (Extended)
description: Detects exposed sensitive files (git, env, config, ssh, cloud, db, logs) via canonical content marker match plus soft-404 control absence on an extended fixed path list.
author: GASH contributors
severity: medium
tags: [sensitive-file, exposure, misconfig, information-disclosure, git, env, ssh, cloud]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 100
phase: probe
order: 91
api_version: "1.0"
tests: tests/fixtures/sensitive-file-exposure/
request:
  method: GET
  paths:
    # Git
    - "/.git/config"
    - "/.git/HEAD"
    - "/.git/index"
    - "/.git/logs/HEAD"
    - "/.git/description"
    # SVN
    - "/.svn/entries"
    - "/.svn/wc.db"
    # Mercurial
    - "/.hg/store"
    - "/.hg/requires"
    # Environment files
    - "/.env"
    - "/.env.local"
    - "/.env.production"
    - "/.env.development"
    - "/.env.staging"
    - "/.env.example"
    - "/.env.sample"
    # Config files
    - "/config.json"
    - "/config.yaml"
    - "/config.yml"
    - "/config.php"
    - "/config.ini"
    - "/settings.json"
    - "/settings.yaml"
    - "/settings.yml"
    - "/app.config"
    - "/web.config"
    # Docker
    - "/docker-compose.yml"
    - "/docker-compose.yaml"
    - "/Dockerfile"
    - "/.dockerignore"
    # Kubernetes
    - "/kubeconfig"
    - "/.kube/config"
    # SSH
    - "/.ssh/id_rsa"
    - "/.ssh/id_rsa.pub"
    - "/.ssh/authorized_keys"
    - "/.ssh/known_hosts"
    # AWS
    - "/.aws/credentials"
    - "/.aws/config"
    # Azure
    - "/.azure/config"
    # GCP
    - "/.config/gcloud/credentials"
    # IDE
    - "/.vscode/settings.json"
    - "/.idea/workspace.xml"
    # Logs
    - "/error.log"
    - "/debug.log"
    - "/access.log"
    - "/application.log"
    - "/laravel.log"
    - "/storage/logs/laravel.log"
    # Database
    - "/database.sqlite"
    - "/database.db"
    - "/app.sqlite"
    - "/app.db"
    # Archives / backups
    - "/backup.zip"
    - "/backup.tar.gz"
    - "/dump.sql"
    - "/backup.sql"
    - "/db_backup.sql"
    - "/www.zip"
    - "/web.zip"
    - "/site.zip"
oracle:
  name: error
  params:
    mode: backup_file
    signature_set: [backup_file]