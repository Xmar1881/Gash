id: cache-poisoning-host-header
name: Cache Poisoning via Host Header
description: Detects host header poisoning and cache key confusion via HeaderOracle host_header mode.
author: GASH contributors
severity: medium
tags: [cache-poisoning, host-header, differential]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 10
phase: probe
order: 85
api_version: "1.0"
tests: tests/fixtures/cache-poisoning-host-header/
request:
  method: GET
oracle:
  name: header
  params:
    mode: host_header
    canary_host: "gash-host-canary.example"
    header_names: ["Host", "X-Forwarded-Host", "X-Original-URL", "Forwarded"]
