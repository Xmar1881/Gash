id: registry-catalog-exposure
name: Registry Catalog Exposure
description: Detects unauthenticated container registry catalog endpoints.
author: GASH contributors
severity: critical
tags: [registry, containers, supply-chain, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 200
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
