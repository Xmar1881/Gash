id: superset-api-exposure
name: Superset API Exposure
description: Detects exposed Apache Superset health and database APIs.
author: GASH contributors
severity: critical
tags: [superset, analytics, database, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 196
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/api/v1/health", "/api/v1/database/", "/superset/api/v1/health"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_superset]
