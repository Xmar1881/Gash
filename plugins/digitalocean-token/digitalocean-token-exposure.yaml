id: digitalocean-token-exposure
name: DigitalOcean Token Exposure
description: Detects exposed DigitalOcean API tokens in deployment files.
author: GASH contributors
severity: critical
tags: [cloud, digitalocean, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 153
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.config/doctl/config.yaml", "/digitalocean.env", "/doctl/config.yaml"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_digitalocean_token]
