id: datadog-key-exposure
name: Datadog Key Exposure
description: Detects exposed Datadog API and application keys.
author: GASH contributors
severity: critical
tags: [datadog, monitoring, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 174
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/config/datadog.env", "/datadog.yaml", "/datadog/config.json"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_datadog_key]
