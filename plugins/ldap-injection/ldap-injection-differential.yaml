# File: plugins/ldap-injection/ldap-injection-differential.yaml
# What: Tier 1 LDAP injection plugin backed by DifferentialOracle (boolean-based).
# Why: Detects LDAP injection via true/false/control differential with N=3 repeats.

id: ldap-injection-differential
name: LDAP Injection Differential
description: Detects LDAP injection via boolean-based differential analysis with control.
author: GASH contributors
severity: high
tags: [ldap, injection, differential, boolean, authorization]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 120
phase: probe
order: 70
api_version: "1.0"
tests: tests/fixtures/ldap-injection-differential/
request:
  method: GET
  param_names: [user, username, uid, filter, search, dn, cn]
  payload: "*)(|(userPassword=*"
  payloads:
    - "*)(uid=*))(|(uid=*"
oracle:
  name: differential
  params:
    repeats: 3