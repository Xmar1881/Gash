# File: plugins/file-upload/file-upload-unrestricted.yaml
# What: Tier 1 active file upload detector using error oracle generic_error mode.
# Why: Unrestricted file upload often leaks stack traces or filesystem errors on invalid uploads.

id: file-upload-unrestricted
name: Unrestricted File Upload
description: Detects unrestricted file upload via generic error signatures in upload responses.
author: GASH contributors
severity: high
tags: [file-upload, unrestricted, rce, error-disclosure, information-leakage]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 50
phase: probe
order: 40
api_version: "1.0"
tests: tests/fixtures/file-upload-unrestricted/
request:
  method: POST
  param_names: ["file", "upload", "avatar", "document", "image", "attachment"]
  payload: "GASH-test-file-content"
oracle:
  name: error
  params:
    mode: "generic_error"