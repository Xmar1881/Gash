id: firebase-config-exposure
name: Firebase Config Exposure
description: Detects exposed Firebase administration and application config.
author: GASH contributors
severity: critical
tags: [firebase, cloud, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 172
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/firebase-adminsdk.json", "/firebase-config.json", "/firebase.json"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_firebase_config]
