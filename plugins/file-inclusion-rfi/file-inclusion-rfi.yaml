id: file-inclusion-rfi
name: File Inclusion RFI
description: Detects remote file include via loopback canary reflection.
author: GASH contributors
severity: high
tags: [rfi, file-include, lfi, injection, reflection]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 100
phase: probe
order: 87
api_version: "1.0"
tests: tests/fixtures/file-inclusion-rfi/
request:
  method: GET
  param_names: [file, page, include, template]
  payload: "http://127.0.0.1:9/gash-canary.txt"
oracle:
  name: reflection
  params:
    canary: "http://127.0.0.1:9/gash-canary.txt"
    contexts: [html, attr, url]
    require_executable_context: false
