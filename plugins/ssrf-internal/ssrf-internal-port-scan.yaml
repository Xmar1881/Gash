id: ssrf-internal-port-scan
name: SSRF Internal Port Scan
description: Detects SSRF via timing differential against internal loopback ports.
author: GASH contributors
severity: high
tags: [ssrf, internal, timing, port-scan]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 30
phase: probe
order: 82
api_version: "1.0"
tests: tests/fixtures/ssrf-internal-port-scan/
request:
  method: GET
  param_names: [url, target, dest]
  payload: "http://127.0.0.1:22/"
oracle:
  name: timing
  params:
    min_delay_ms: 5000
    repeats: 3
    strategy: mann-whitney-u
