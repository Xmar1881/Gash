# File: plugins/command-injection/command-injection-error.yaml
# What: Tier 1 command injection plugin backed by ErrorSignatureOracle (generic_error mode).
# Why: Detects OS command injection via shell error signature match plus absent-in-control proof.

id: command-injection-error
name: Command Injection Error-Based
description: Detects OS command injection via shell error signature match plus absent-in-control proof.
author: GASH contributors
severity: critical
tags: [command-injection, injection, rce, error-signature]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 60
phase: probe
order: 60
api_version: "1.0"
tests: tests/fixtures/command-injection-error/
request:
  method: GET
  param_names: [cmd, exec, command, ip, host, target, arg]
  payload: "; cat /etc/passwd"
  payloads:
    - "| cat /etc/passwd"
    - "'; cat /etc/passwd"
oracle:
  name: error
  params:
    mode: "generic_error"
    signature_set: ["generic_error"]