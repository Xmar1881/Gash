# File: plugins/command-injection/command-injection-timing.yaml
# What: Tier 1 blind command injection plugin backed by TimingOracle (GASH-010).
# Why: Time-based blind OS command injection needs statistical delay proof;
#   timing is firm-maximum without OOB (confirmed YOK).
# Safety: HARMSIZ canary only (`sleep 5` delay). No destructive payload
#   (`cat /etc/passwd`, `id`, `rm`, reverse shell) is ever sent. Tavan firm.

id: command-injection-timing
name: Command Injection Time-Based (Blind)
description: Detects blind OS command injection via statistical delay analysis with harmless sleep canary (firm maximum, never confirmed without OOB).
author: GASH contributors
severity: high
tags: [command-injection, injection, blind, timing]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 100
phase: probe
order: 61
api_version: "1.0"
tests: tests/fixtures/command-injection-timing/
request:
  method: GET
  param_names: [cmd, exec, command, ip, host, target, arg]
  payload: "; sleep 5"
oracle:
  name: timing
  params:
    min_delay_ms: 5000
    repeats: 3
    strategy: "mann-whitney-u"
