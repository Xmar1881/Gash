# File: plugins/ssrf/ssrf-cloud-metadata.yaml
# What: Tier 1 cloud-metadata SSRF screen via link-local metadata URL.
# Why: Fetching 169.254.169.254 inside a response (ami-id and sibling tokens)
#   proves the target server performed the request; reflection absent in the
#   neutral control keeps encoded/double-fetch noise out.

id: ssrf-cloud-metadata
name: SSRF Cloud Metadata (169.254.169.254)
description: Detects server-side request forgery reaching the cloud instance metadata endpoint via metadata token reflection.
author: GASH contributors
severity: high
tags: [ssrf, cloud, metadata, reflection]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 100
phase: probe
order: 62
api_version: "1.0"
tests: tests/fixtures/ssrf-cloud-metadata/
request:
  method: GET
  param_names: [url, redirect, next, dest, target, image, file, path, callback]
  payload: "http://169.254.169.254/latest/meta-data/"
  payloads:
    - "http://100.100.100.200/latest/meta-data/"
    - "http://169.254.169.254/metadata/instance?api-version=2021-02-01"
  headers:
    Metadata: "true"
oracle:
  name: reflection
  params:
    canary: "ami-id"
    canary_by_payload:
      "http://100.100.100.200/latest/meta-data/": "instance-id"
      "http://169.254.169.254/metadata/instance?api-version=2021-02-01": "vmId"
