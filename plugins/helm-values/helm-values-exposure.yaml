id: helm-values-exposure
name: Helm Values Exposure
description: Detects exposed Helm release values and Kubernetes secret manifests.
author: GASH contributors
severity: critical
tags: [helm, kubernetes, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 162
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/values.yaml", "/helm-values.yaml", "/charts/app/values.yaml"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_helm_values]
