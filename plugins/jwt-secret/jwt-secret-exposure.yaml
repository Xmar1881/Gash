id: jwt-secret-exposure
name: JWT Secret Exposure
description: Detects exposed JWT signing secrets in application configuration.
author: GASH contributors
severity: critical
tags: [jwt, authentication, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 160
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/config/jwt.env", "/jwt-secret.txt", "/auth/config.json"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_jwt_secret]
