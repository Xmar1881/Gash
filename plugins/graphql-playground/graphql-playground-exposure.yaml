id: graphql-playground-exposure
name: GraphQL Playground Exposure
description: Detects publicly served GraphiQL, GraphQL Playground, or Apollo Sandbox consoles.
author: GASH contributors
severity: low
tags: [graphql, api, exposure, discovery]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 10
phase: discovery
order: 113
api_version: "1.0"
tests: tests/fixtures/endpoint-exposure/
request:
  method: GET
  paths: ["/graphiql", "/playground", "/graphql/playground", "/graphql"]
oracle:
  name: version
  params:
    mode: banner
    banner_regex: '(?i)(graphql playground|graphiql|apollo sandbox)'
