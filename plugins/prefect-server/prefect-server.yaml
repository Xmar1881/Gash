id: prefect-server
name: Prefect Server Exposure
description: Detects an exposed Prefect Server Exposure management or metadata endpoint using a product-specific response marker.
author: GASH contributors
severity: high
tags: [orchestration, workflow, error, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 3
phase: discovery
order: 302
api_version: "1.0"
tests: tests/fixtures/rare-critical-exposure/
request:
  method: GET
  paths: ["/api/health"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_rare_prefect_server]
