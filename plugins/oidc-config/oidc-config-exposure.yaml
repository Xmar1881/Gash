id: oidc-config-exposure
name: OIDC Config Exposure
description: Detects exposed OpenID Connect issuer and JWKS configuration.
author: GASH contributors
severity: high
tags: [oidc, identity, discovery, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 199
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.well-known/openid-configuration", "/oidc/.well-known/openid-configuration", "/oauth2/.well-known/openid-configuration"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_oidc_config]
