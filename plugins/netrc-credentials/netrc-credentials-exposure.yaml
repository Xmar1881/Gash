id: netrc-credentials-exposure
name: Netrc Credentials Exposure
description: Detects machine login and password credentials in exposed netrc files.
author: GASH contributors
severity: critical
tags: [credentials, netrc, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 167
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.netrc", "/netrc", "/home/app/.netrc"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_netrc]
