id: openfga-api
name: OpenFGA API Exposure
description: Detects an exposed OpenFGA API Exposure management or metadata endpoint using a product-specific response marker.
author: GASH contributors
severity: high
tags: [authorization, admin, error, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 3
phase: discovery
order: 400
api_version: "1.0"
tests: tests/fixtures/rare-critical-exposure/
