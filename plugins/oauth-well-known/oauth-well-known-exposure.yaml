id: oauth-well-known-exposure
name: OAuth Well-Known Exposure
description: Detects exposed OAuth authorization server metadata endpoints.
author: GASH contributors
severity: high
tags: [oauth, identity, discovery, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 198
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.well-known/oauth-authorization-server", "/oauth/.well-known", "/.well-known/oauth"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_oauth_well_known]
