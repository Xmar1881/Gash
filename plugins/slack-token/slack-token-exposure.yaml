id: slack-token-exposure
name: Slack Token Exposure
description: Detects exposed Slack bot and app tokens in configuration paths.
author: GASH contributors
severity: critical
tags: [slack, secrets, messaging, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 154
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/config/slack.env", "/slack-token.txt", "/.slack/config"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_slack_token]
