id: private-key-exposure
name: Private Key Exposure
description: Detects PEM private keys exposed through common artifact paths.
author: GASH contributors
severity: critical
tags: [keys, cryptography, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 158
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/private.key", "/server.key", "/backup/private.pem"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_private_key]
