id: environment-file-exposure
name: Environment File Exposure
description: Detects exposed dotenv and application environment files through canonical secret markers.
author: GASH contributors
severity: high
tags: [environment, secrets, exposure, misconfig]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 119
api_version: "1.0"
tests: tests/fixtures/backup-file-exposure/
request:
  method: GET
  paths: ["/.env", "/.env.local", "/config/.env", "/app/.env"]
oracle:
  name: error
  params:
    mode: backup_file
    signature_set: [backup_file]
