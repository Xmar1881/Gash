# File: plugins/rate-limit/missing-rate-limit.yaml
# What: Tier 1 missing-rate-limit screen backed by HeaderOracle
#   (ratelimit mode, GASH-032, CWE-770, tentative ceiling).
# Why: Aynı endpoint'e bütçeli burst (params burst, default 20, tavan 50;
#   profil + max_requests + RatePerSecond motorca zorlanır) → 429/lockout/
#   rate-limit sinyali YOKSA tentative bulgu. Credential stuffing YOK:
#   isimsiz boş GET burst'ü, login kilitleme riski YOK.
# Red lines: burst yalnızca --active + --scope içi + agresif profil önerisi;
# kapsam-dışı istek YOK (policy preflight), yıkıcı payload YOK, secret log YOK.
# Tier gerekçesi: burst döngüsü Tier 1 differential/timing repeats önceliğiyle
# aynı deklaratif kalıptır (motor toplar, oracle saf doğrular); Tier 2'de
# fixture parametre akışı taşınamadığı için dürüst tavan verilemez.

id: missing-rate-limit
name: Missing Rate Limit
description: Screens endpoints for missing rate limiting via a budgeted anonymous burst with no 429 lockout or rate-limit signals, reported at tentative confidence.
author: GASH contributors
severity: medium
tags: [rate-limit, brute-force, misconfig, header]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 30
phase: probe
order: 71
api_version: "1.0"
tests: tests/fixtures/missing-rate-limit/
request:
  method: GET
oracle:
  name: header
  params:
    mode: "ratelimit"
    burst: 20
