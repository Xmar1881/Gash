# File: plugins/path-traversal/path-traversal-error.yaml
# What: Tier 1 path traversal file access detection via ErrorSignatureOracle.
# Why: Proves traversal through successful target-file content (passwd/win.ini)
#   instead of relying on include warnings that also appear for neutral controls.

id: path-traversal-error
name: Path Traversal File Access
description: Detects path traversal by matching successful target-file content in responses.
author: GASH contributors
severity: high
tags: [path-traversal, file-access, lfi, error-signature]
safe: false
deep: false
active: true
requires_auth: false
phase: probe
order: 30
api_version: "1.0"
tests: tests/fixtures/path-traversal-error/
request:
  method: GET
  param_names: ["file", "path", "page", "include", "template"]
  payload: 'C:\Windows\win.ini'
  payloads:
    - "/etc/passwd"
    - "../../../../etc/passwd"
    - "....//....//....//....//etc/passwd"
    - '..\..\..\..\..\..\..\..\..\..\..\windows\win.ini'
oracle:
  name: error
  params:
    mode: path_traversal
    signature_set: ["unix_passwd", "windows_ini"]
