# File: plugins/path-traversal/path-traversal-error.yaml
# What: Tier 1 path traversal file access detection via ErrorSignatureOracle.
# Why: Detects path traversal vulnerabilities by identifying file access error
#   signatures in responses; uses existing ErrorSignatureOracle with "path_traversal" mode.

id: path-traversal-error
name: Path Traversal File Access
description: Detects path traversal vulnerabilities via file access error signatures in responses.
author: GASH contributors
severity: high
tags: [path-traversal, file-access, lfi, error-signature]
safe: false
deep: false
active: true
requires_auth: false
phase: probe
order: 30
api_version: "1.0"
tests: tests/fixtures/path-traversal-error/
request:
  method: GET
  param_names: ["file", "path", "page", "include", "template"]
  payload: "../../../etc/passwd"
oracle:
  name: error
  params:
    mode: path_traversal
    signature_set: ["path_traversal"]