id: prometheus-metrics-exposure
name: Prometheus Metrics Exposure
description: Detects publicly served Prometheus metrics endpoints and metric payloads.
author: GASH contributors
severity: low
tags: [metrics, exposure, monitoring, discovery]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 114
api_version: "1.0"
tests: tests/fixtures/endpoint-exposure/
request:
  method: GET
  paths: ["/metrics", "/prometheus", "/actuator/prometheus"]
oracle:
  name: version
  params:
    mode: banner
    banner_regex: '(?m)^#\s*(HELP|TYPE)\s+[a-zA-Z_:][a-zA-Z0-9_:]*'
