id: sonarqube-api-exposure
name: SonarQube API Exposure
description: Detects exposed SonarQube system and component metadata APIs.
author: GASH contributors
severity: high
tags: [sonarqube, code-quality, cicd, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 190
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/api/system/status", "/api/components/search", "/sonar/api/system/status"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_sonarqube]
