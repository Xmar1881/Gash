id: twilio-token-exposure
name: Twilio Token Exposure
description: Detects exposed Twilio authentication tokens in service files.
author: GASH contributors
severity: critical
tags: [twilio, communications, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 156
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/config/twilio.json", "/twilio.env", "/twilio-config.json"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_twilio_token]
