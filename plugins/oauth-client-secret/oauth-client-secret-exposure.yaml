id: oauth-client-secret-exposure
name: OAuth Client Secret Exposure
description: Detects OAuth configuration responses that disclose client secrets.
author: GASH contributors
severity: critical
tags: [oauth, identity, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 147
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/oauth/config", "/.well-known/oauth-authorization-server", "/config/oauth"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_oauth_client_secret]
