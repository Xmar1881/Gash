id: stripe-secret-exposure
name: Stripe Secret Exposure
description: Detects exposed live Stripe secret keys in deployment configuration.
author: GASH contributors
severity: critical
tags: [stripe, payments, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 155
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/config/stripe.json", "/stripe.env", "/stripe-config.json"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_stripe_secret]
