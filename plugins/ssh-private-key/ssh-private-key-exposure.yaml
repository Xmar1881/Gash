id: ssh-private-key-exposure
name: SSH Private Key Exposure
description: Detects OpenSSH private keys exposed from deployment file paths.
author: GASH contributors
severity: critical
tags: [ssh, keys, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 159
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.ssh/id_rsa", "/id_ed25519", "/ssh/id_ed25519"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_ssh_private_key]
