id: kubeflow-dashboard
name: Kubeflow Dashboard Exposure
description: Detects an exposed Kubeflow Dashboard Exposure management or metadata endpoint using a product-specific response marker.
author: GASH contributors
severity: high
tags: [ml, kubernetes, error, exposure]
safe: true
deep: false
active: false
requires_auth: false
max_requests: 3
phase: discovery
order: 307
api_version: "1.0"
tests: tests/fixtures/rare-critical-exposure/
request:
  method: GET
  paths: ["/pipeline/apis/v1beta1/pipelines"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_rare_kubeflow_dashboard]
