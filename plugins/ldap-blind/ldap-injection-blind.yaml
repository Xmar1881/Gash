id: ldap-injection-blind
name: LDAP Injection Blind
description: Detects blind LDAP injection via timing differential.
author: GASH contributors
severity: high
tags: [ldap, injection, timing, blind]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 30
phase: probe
order: 86
api_version: "1.0"
tests: tests/fixtures/ldap-injection-blind/
request:
  method: GET
  param_names: [user, username, search]
  payload: "*) (uid=*)) (|(uid=*"
oracle:
  name: timing
  params:
    min_delay_ms: 5000
    repeats: 3
    strategy: mann-whitney-u
