# File: plugins/ldap-blind/ldap-injection-oob.yaml
# What: Tier 1 blind LDAP injection plugin backed by OOBOracle.
# Why: Blind LDAP injection with out-of-band DNS/HTTP callback.
#   Requires self-hosted --oob-server; without it the plugin skips honestly.
#   Payloads attempt to trigger LDAP referrals or external lookups that
#   reach the OOB server. Environment-specific; confirmed ONLY on callback.

id: ldap-injection-oob
name: LDAP Injection OOB (Blind)
description: Detects blind LDAP injection via out-of-band callback. Requires --oob-server.
author: GASH contributors
severity: critical
tags: [ldap, injection, blind, oob]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 40
phase: probe
order: 87
oob: required
api_version: "1.0"
tests: tests/fixtures/ldap-injection-oob/
request:
  method: GET
  param_names: [user, username, search, filter, dn, cn]
  payloads:
    - "*)(cn=*))(|(cn={{OOB_DOMAIN}}"
    - "*)(uid=*))(|(uid={{OOB_DOMAIN}}"
    - "*))(|(objectClass=*"
oracle:
  name: oob
  params:
    namespace: "ldap-inj"