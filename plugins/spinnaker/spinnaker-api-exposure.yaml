id: spinnaker-api-exposure
name: Spinnaker API Exposure
description: Detects exposed Spinnaker Gate and application metadata APIs.
author: GASH contributors
severity: critical
tags: [spinnaker, deployment, cicd, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 185
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/gate/version", "/applications", "/spinnaker/health"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_spinnaker]
