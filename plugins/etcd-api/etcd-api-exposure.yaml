id: etcd-api-exposure
name: etcd API Exposure
description: Detects unauthenticated etcd key-value and cluster API responses.
author: GASH contributors
severity: critical
tags: [etcd, cloud, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 130
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/v2/keys", "/v3/kv/range", "/version"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_etcd_api]
