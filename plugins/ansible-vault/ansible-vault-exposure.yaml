id: ansible-vault-exposure
name: Ansible Vault Exposure
description: Detects Ansible Vault encrypted material exposed in repository paths.
author: GASH contributors
severity: critical
tags: [ansible, automation, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 161
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/vault-password-file", "/ansible-vault.txt", "/group_vars/all/vault.yml"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_ansible_vault]
