# File: plugins/expression-language-injection/expression-language-injection.yaml
# What: Tier 1 server-side expression language (EL/SpEL/OGNL/Thymeleaf)
#   evaluation screen via ReflectionOracle with per-payload product
#   canaries (GASH-061, CWE-917).
# Why: ${1337*1337}, #{1337*1337}, *{1337*1337}, and %{1337*1337} are inert
#   arithmetic: an echoing server reflects the literal expression (7*7 text
#   does not contain 1787569) while an evaluating engine emits the product.
#   The 7-digit product is the canary, so plain-text reflection of the
#   payload can never match. JSON responses are rejected by the oracle, and
#   only HTML text/attribute contexts count (inline script data does not).

id: expression-language-injection
name: Expression Language Injection
description: Detects server-side expression language evaluation by mapping inert arithmetic payloads to their product canary in HTML contexts.
author: GASH contributors
severity: high
tags: [expression-language, injection, reflection, misconfig]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 50
phase: probe
order: 92
api_version: "1.0"
tests: tests/fixtures/expression-language-injection/
request:
  method: GET
  param_names: [q, search, name, message]
  payload: "${1337*1337}"
  payloads:
    - "#{1337*1337}"
    - "*{1337*1337}"
    - "%{1337*1337}"
oracle:
  name: reflection
  params:
    require_executable_context: false
    contexts: [html, attr]
    canary_by_payload:
      "${1337*1337}": "1787569"
      "#{1337*1337}": "1787569"
      "*{1337*1337}": "1787569"
      "%{1337*1337}": "1787569"
