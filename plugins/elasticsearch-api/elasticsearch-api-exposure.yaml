id: elasticsearch-api-exposure
name: Elasticsearch API Exposure
description: Detects unauthenticated Elasticsearch cluster and node APIs.
author: GASH contributors
severity: critical
tags: [elasticsearch, search, data, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 136
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/", "/_cluster/health", "/_nodes"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_elasticsearch_api]
