#
# File: plugins/ssi-injection/ssi-injection.yaml
# What: Tier 1 server-side include (SSI) evaluation screen via
#   ErrorSignatureOracle "content" mode with the ssi signature set plus
#   neutral-parameter control (GASH-064, CWE-97).
# Why: <!--#printenv --> only yields CGI variable lines (GATEWAY_INTERFACE,
#   SERVER_SOFTWARE, ...) when the server actually evaluates the directive;
#   a literal echo contains no marker. The signature requires two distinct
#   variables so generic $_SERVER debug dumps do not match, and the
#   neutral-value control must be marker-free. Payloads are echo/printenv
#   only: no #exec, no file writes, no destructive directives.

id: ssi-injection
name: SSI Injection
description: Detects server-side include directive evaluation by matching printenv CGI markers with neutral-parameter control absence.
author: GASH contributors
severity: high
tags: [ssi, injection, error, misconfig]
safe: false
deep: false
active: true
requires_auth: false
max_requests: 40
phase: probe
order: 95
api_version: "1.0"
tests: tests/fixtures/ssi-injection/
request:
  method: GET
  param_names: [q, search, name, page, content, message]
  payload: "<!--#printenv -->"
  payloads:
    - '<!--#echo var="DATE_LOCAL" -->'
oracle:
  name: error
  params:
    mode: content
    signature_set: [ssi]
