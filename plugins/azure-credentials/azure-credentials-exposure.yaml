id: azure-credentials-exposure
name: Azure Credentials Exposure
description: Detects exposed Azure client secrets in fixed credential paths.
author: GASH contributors
severity: critical
tags: [cloud, azure, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 151
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.azure/credentials", "/azure-credentials.json", "/config/azure.env"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_azure_credentials]
