id: sendgrid-key-exposure
name: SendGrid Key Exposure
description: Detects exposed SendGrid API keys in mail service configuration.
author: GASH contributors
severity: critical
tags: [sendgrid, email, secrets, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 157
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/config/sendgrid.env", "/sendgrid.env", "/mail/sendgrid.json"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_sendgrid_key]
