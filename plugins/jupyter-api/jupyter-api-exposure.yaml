id: jupyter-api-exposure
name: Jupyter API Exposure
description: Detects public Jupyter notebook and kernel APIs.
author: GASH contributors
severity: critical
tags: [jupyter, notebook, admin, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 8
phase: discovery
order: 140
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/tree", "/api/kernels", "/api/contents"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_jupyter_api]
