id: nginx-status-exposure
name: Nginx Status Exposure
description: Detects exposed Nginx worker and connection status endpoints.
author: GASH contributors
severity: high
tags: [nginx, proxy, information-disclosure, exposure]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 177
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
