id: pypi-token-exposure
name: PyPI Token Exposure
description: Detects exposed Python Package Index upload tokens.
author: GASH contributors
severity: critical
tags: [python, pypi, supply-chain, secrets]
safe: false
deep: false
active: false
requires_auth: false
max_requests: 6
phase: discovery
order: 164
api_version: "1.0"
tests: tests/fixtures/critical-exposure/
request:
  method: GET
  paths: ["/.pypirc", "/pypi.conf", "/.config/pypoetry/auth.toml"]
oracle:
  name: error
  params:
    mode: critical_exposure
    signature_set: [critical_pypi_token]
