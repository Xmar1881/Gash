# docker-compose.lab.yml — recall laboratuvarı pinleri (S4/A-21).
# Faz 2'de iskelet; imaj digest'leri Faz 3 lab kurulumunda kilitlenir.
# localhost-only, izole network; `latest` YOKTUR (tekrar üretilebilirlik).
version: "3.8"
services:
  dvwa:
    image: vulnerables/web-dvwa:2.0
    networks: [gash-lab]
    ports: ["127.0.0.1:8081:80"]
  juiceshop:
    image: bkimminich/juice-shop:17.1.0
    networks: [gash-lab]
    ports: ["127.0.0.1:8082:3000"]
  webgoat:
    image: webgoat/webgoat:2023.8
    networks: [gash-lab]
    ports: ["127.0.0.1:8083:8080"]
networks:
  gash-lab:
    internal: true
