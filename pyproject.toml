[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gash"
version = "0.6.0"
description = "Fast, modular automated web vulnerability scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Xmar1881" }]
keywords = ["security", "pentest", "scanner", "sqli", "xss", "recon"]
dependencies = [
  "colorama>=0.4.6",
  "requests>=2.31",
  "dnspython>=2.4",
]

[project.optional-dependencies]
dom = ["playwright"]
jsast = ["tree-sitter>=0.26.0", "tree-sitter-javascript>=0.23"]
oob = ["cryptography"]
http3 = ["aioquic>=1.2"]
test = ["pytest>=8.0"]
full = [
  "playwright",
  "tree-sitter>=0.26.0",
  "tree-sitter-javascript>=0.23",
  "cryptography",
  "aioquic>=1.2",
]

[project.urls]
Homepage = "https://github.com/Xmar1881/Gash"
Repository = "https://github.com/Xmar1881/Gash"
Issues = "https://github.com/Xmar1881/Gash/issues"
Changelog = "https://github.com/Xmar1881/Gash/blob/main/CHANGELOG.md"

[project.scripts]
gash = "gash:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Focused gate: real bugs (unused imports/vars) + syntax.
# Broad style rules stay off: network scanners catch broad exceptions
# on purpose, and short regex aliases (re.I) are fine.
select = ["F", "E9"]

[tool.setuptools]
py-modules = ["gash"]

[tool.setuptools.packages.find]
include = ["core*"]
