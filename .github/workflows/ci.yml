name: GASH CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ruff bandit pip-audit
      - run: python -m pip install -e ".[test]"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - run: go vet ./...
        working-directory: go
      - run: go test ./...
        working-directory: go
      - run: go build -o bin/gash-worker .
        working-directory: go
      - run: python -m ruff check core gash.py tests
      - run: python -m bandit -q -ll -r core gash.py
      - run: python -m pip_audit -r requirements.txt
      - run: python -c "from core import __version__; assert __version__ == '0.6.0'"
      - run: gash --version
      - run: gash --list-checks --no-banner
      - run: python -m pytest tests/ -q
