# General CI for Gash
# Runs on all PRs and pushes to main — not tied to plugin changes only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Build (deep tags)
        run: go build -tags deep ./cmd/gash

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (short)
        run: go test -short ./...

      - name: Run vet
        run: go vet ./...

      - name: Run fmt check
        run: |
          unformatted=$(gofmt -l internal cmd tests plugins templates proto)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: Static Analysis (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104 ./...

  schema-sync:
    name: Schema Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check schema sync
        run: |
          go run ./cmd/gash plugins schema-gen > /tmp/generated.json
          if ! cmp -s /tmp/generated.json schemas/plugin.schema.json; then
            echo "ERROR: schema/plugin.schema.json is out of sync with rules.go"
            echo "Run: go run ./cmd/gash plugins schema-gen > schemas/plugin.schema.json"
            exit 1
          fi

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [build, test, lint, vulncheck, gosec, schema-sync]
    if: always()
    steps:
      - name: Summarize
        run: |
          echo "All CI checks completed"