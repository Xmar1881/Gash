#
# File: .github/workflows/plugin-ci.yml
# What: Pull-request gate for engine accuracy plus community plugins.
# Why: Schema sync plus fixtures plus corpus plus B11 plus vet plus bench
#   keep accuracy independent of plugin authorship on every PR.
#
# P0.4 note: the `paths` filter below covers every core package (engine,
# oracle, baseline, probe, finding, reporter, oob, plugin, testutil), the CLI,
# the Tier 3 contract, module files, and the lint config itself — core motor
# changes can no longer bypass CI. One workflow, one job chain (no Fan-out).

name: plugin-ci

on:
  pull_request:
    paths:
      - "plugins/**"
      - "tests/**"
      - "internal/**"
      - "cmd/**"
      - "pkg/**"
      - "proto/**"
      - "schemas/**"
      - "templates/**"
      - "docs/metrics/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/**"
      - "docker-compose.lab.yml"
  push:
    branches: [main]

jobs:
  plugin-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Dependency CVE scan (govulncheck)
        # Deep-research report §CI Entegrasyon: go.mod bağımlılık CVE kontrolü.
        # Bulgu = fail (kapı gibi çalışır); stdlib bulguları toolchain bump gerektirir.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Static security scan (gosec, pinned)
        # Deep-research report §CI Entegrasyon: statik analiz (pinli sürüm).
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.7
          "$(go env GOPATH)/bin/gosec" -quiet ./internal/... ./cmd/... 2>&1 | tee gosec-report.txt

      - name: Format check (gofmt, zero tolerance)
        run: |
          out=$(gofmt -l internal cmd tests plugins templates proto)
          if [ -n "$out" ]; then
            echo "unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "gofmt clean"

      - name: Full unit tests
        run: go test ./...

      - name: Evidence matrix (oracle/probe rows)
        # §9 CI matrisi: XSS baglam/JSON regresyonlari + WAF davranis
        # sayaçlari her PR'da isimle kosar (go test ./... icinde de vardir,
        # burada satir bazinda gorunurluk icin tekrar listelenir).
        run: |
          go test ./internal/oracle/ -run 'TestReflection|TestExecutionMatrix|TestDifferential|TestTiming|TestError|TestHeader' -v
          go test ./internal/probe/ ./internal/wafbypass/ -v
          go test ./internal/reporter/ -run 'TestStaticExecutionEvidence|TestBrowserConfirmedEvidenceType' -v
          go test ./internal/plugin/loader/ -run 'TestExecuteJSInfiniteLoopAborts' -v
          go test ./internal/bench/ -short -v

      - name: Headless DOM XSS browser verification (Chrome deep-tag)
        # Deep DOM verification: runs real headless Chrome via chromedp (-tags deep).
        # Verifies that DOM source-to-sink payload executes in real Chrome and neutral control remains clean.
        # Enforces that Chrome runs, that no deep test is skipped, and that the
        # key browser proofs pass in CI.
        run: |
          echo "=== Verifying Chrome binary in CI ==="
          if ! command -v google-chrome &>/dev/null && [ ! -x "/usr/bin/google-chrome" ]; then
            echo "google-chrome not found, installing..."
            sudo apt-get update && sudo apt-get install -y google-chrome-stable || true
          fi
          CHROME_BIN="$(command -v google-chrome || echo /usr/bin/google-chrome)"
          echo "Using Chrome: $CHROME_BIN"
          "$CHROME_BIN" --version || true
          export CHROME_BIN
          export CI=true

          echo "=== Running Headless Deep Tests ==="
          # This step runs under bash -e: an unguarded `out=$(go test ...)` aborts
          # the script on the first non-zero exit and swallows the test output,
          # leaving CI with "exit code 1" and no diagnosis. Capture both the
          # output and the exit code, print them, then decide.
          set +e
          out="$(go test -tags deep -v -count=1 ./internal/headless/... 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "ERROR: deep headless suite failed (go test exit $code)" >&2
            echo "--- failing lines ---" >&2
            printf '%s\n' "$out" | grep -E '^(--- FAIL|FAIL|panic|ok |=== RUN)' >&2 || true
            exit 1
          fi
          if printf '%s\n' "$out" | grep -Eq '^[[:space:]]*--- SKIP|no Chrome binary found in CI'; then
            echo "ERROR: a headless deep test was skipped in CI!" >&2
            exit 1
          fi
          for want in TestDeepVerifiesDOMExecution TestDeepVerifyXSSHashRoute; do
            if ! printf '%s\n' "$out" | grep -q -- "--- PASS: $want"; then
              echo "ERROR: $want did not pass!" >&2
              exit 1
            fi
          done
          echo "Deep headless verification passed."

      - name: Race detector (core packages)
        run: go test -race -count=1 ./internal/engine/... ./internal/proto/... ./internal/oracle/ ./internal/plugin/... ./internal/probe/ ./internal/finding/ ./internal/baseline/

      - name: Lint (no new issues vs base, pinned binary)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          BASE="$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)"
          "$(go env GOPATH)/bin/golangci-lint" run --new-from-rev "$BASE" --whole-files=false ./...

      - name: Schema sync check
        # rules.go is the single source of truth; the committed schema must
        # match GenerateJSONSchema byte for byte (see docs/architecture.md A-09).
        run: go test ./internal/plugin/ -run TestSchemaSync -v

      - name: Fixture tests (precision gate 0.99)
        run: go test ./tests/plugins/ -run TestMetricGate -v

      - name: Corpus gate (firm+ equals fail)
        run: go test ./tests/corpus/ -run TestNoFalsePositives -v

      - name: Contract gates (B3, B6, B7, B9, B10)
        run: go test ./tests/contract/ -v

      - name: B11 grep (no hardcoded check counts or names)
        run: |
          if grep -RIn --include='*.go' -E 'NumVulnChecks|HardcodedChecks|numChecks = 7|totalChecks =' internal cmd pkg 2>/dev/null; then
            echo "B11: hardcoded check count or name found" >&2
            exit 1
          fi
          echo "B11 grep clean"

      - name: Bench budget (warm discovery under 150ms)
        run: go test ./tests/bench/ -run TestWarmDiscoveryBudget -v

      - name: CLI smoke (validate plus test plus list plus info)
        run: |
          go run ./cmd/gash plugins list
          go run ./cmd/gash plugins validate plugins/headers/missing-security-headers.yaml
          go run ./cmd/gash plugins test plugins/headers/missing-security-headers.yaml
          go run ./cmd/gash plugins info missing-security-headers

      - name: Metrics linkage
        # Every discovered plugin needs docs/metrics/<id>.md with Precision,
        # Recall, Corpus, Lab, and Gate Verdict sections (enforced again by
        # TestMetricGate so the docs never drift from measured numbers).
        run: |
          echo "Metrics reports live under docs/metrics/ (see docs/metrics/README.md)."
          echo "TestMetricGate fails the build when a report is missing or stale."
          ls docs/metrics/
